[project]
name = "datapilotflow-events"
version = "1.0.0"
description = "DataPilotFlow events - RabbitMQ-based event publishing and listening"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datapilotflow-domain>=1.0.0",
    "aio-pika>=9.5.5",
    "pydantic>=2.10.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]
