name: datapilotflow

services:
  # ============================================================================
  # APPLICATION SERVICES
  # ============================================================================

  # DataPilotFlow API Server
  api:
    build:
      context: ..
      dockerfile: docker/services/api/Dockerfile
    container_name: datapilotflow-api-server
    ports:
      - "8800:8800"
    environment:
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8800
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB_NAME=datapilotflow
      - MONGO_USER=datapilotflow
      - MONGO_PASS=datapilotflow123
      - VECTOR_DB_HOST=milvus
      - VECTOR_DB_HTTP_PORT=19530
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=datapilotflow
      - RABBITMQ_PASS=datapilotflow123
    depends_on:
      mongodb:
        condition: service_healthy
      milvus:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../logs/api:/app/logs
      - ../data/upload:/app/upload
    networks:
      - datapilotflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # DataPilotFlow Event Listeners
  # Runs Job, FileUpload, and Notification event listeners
  event-listeners:
    build:
      context: ..
      dockerfile: docker/services/events/Dockerfile
    container_name: datapilotflow-event-listeners
    # No ports exposed - internal RabbitMQ communication only
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=datapilotflow
      - RABBITMQ_PASS=datapilotflow123
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB_NAME=datapilotflow
      - MONGO_USER=datapilotflow
      - MONGO_PASS=datapilotflow123
      - VECTOR_DB_HOST=milvus
      - VECTOR_DB_HTTP_PORT=19530
      - LOG_LEVEL=INFO
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - ../logs/event-listeners:/app/datapilotflow-events/logs
      - ../data/upload:/app/datapilotflow-events/upload
    networks:
      - datapilotflow-network
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # DataPilotFlow RAG MCP Server
  # Provides knowledge retrieval via Model Context Protocol
  mcp-rag-agent:
    build:
      context: ..
      dockerfile: docker/services/mcp-agent/Dockerfile
    container_name: datapilotflow-mcp-rag
    ports:
      - "65510:65510"
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=65510
      - VECTOR_DB_HOST=milvus
      - VECTOR_DB_HTTP_PORT=19530
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB_NAME=datapilotflow
      - MONGO_USER=datapilotflow
      - MONGO_PASS=datapilotflow123
    depends_on:
      milvus:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ../logs/mcp-rag-agent:/app/logs
    networks:
      - datapilotflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:65510/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # DataPilotFlow Dashboard
  # Frontend web application for DataPilotFlow
  dashboard:
    build:
      context: ..
      dockerfile: docker/services/dashboard/Dockerfile
    container_name: datapilotflow-dashboard
    ports:
      - "3000:3000"
    environment:
      # Read by the browser, not the container — override this if the API
      # is reachable at a different host/port than the machine running
      # docker-compose (e.g. deploying to a remote server).
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8800}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - datapilotflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================

  # DataPilotFlow MongoDB Database
  # Using port 27020 externally to avoid conflicts with other MongoDB instances
  mongodb:
    image: mongo:7.0
    container_name: datapilotflow-mongodb
    ports:
      - "27020:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=datapilotflow
      - MONGO_INITDB_ROOT_PASSWORD=datapilotflow123
      - MONGO_INITDB_DATABASE=datapilotflow
    volumes:
      - ../data/datapilotflow-mongodb:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - datapilotflow-network
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Milvus etcd (Metadata Store)
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: datapilotflow-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ../data/datapilotflow-milvus-etcd:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - datapilotflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus MinIO (Object Storage)
  milvus-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: datapilotflow-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9002:9001"  # MinIO Console
      - "9000:9000"  # MinIO API
    volumes:
      - ../data/datapilotflow-milvus-minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - datapilotflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus Vector Database
  milvus:
    image: milvusdb/milvus:v2.6.2
    container_name: datapilotflow-milvus
    ports:
      - "19530:19530"  # Milvus gRPC port
      - "9091:9091"    # Milvus WebUI port
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ../data/datapilotflow-milvus:/var/lib/milvus
    networks:
      - datapilotflow-network
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - "milvus-etcd"
      - "milvus-minio"

  # DataPilotFlow RabbitMQ Message Broker
  # Using ports 5675/15675 externally to avoid conflicts with other RabbitMQ instances
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: datapilotflow-rabbitmq
    ports:
      - "5675:5672"
      - "15675:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=datapilotflow
      - RABBITMQ_DEFAULT_PASS=datapilotflow123
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - ../data/datapilotflow-rabbitmq:/var/lib/rabbitmq
    networks:
      - datapilotflow-network
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  datapilotflow-network:
    driver: bridge
