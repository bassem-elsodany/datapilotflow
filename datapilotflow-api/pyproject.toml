[project]
name = "datapilotflow-api"
version = "1.0.0"
description = "DataPilotFlow API - REST API exposure layer for UI and integrations"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datapilotflow-domain>=1.0.0",
    "datapilotflow-persistence>=1.0.0",
    "datapilotflow-services>=1.0.0",
    "datapilotflow-agents>=1.0.0",
    "fastapi[standard]>=0.115.8",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.20",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "loguru>=0.7.3",
    "langgraph>=1.0.2",
    "langgraph-checkpoint-mongodb>=0.1.0",
    "PyJWT>=2.10.0",
    "opik>=1.9.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
