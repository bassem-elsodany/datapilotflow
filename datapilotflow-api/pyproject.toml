[project]
name = "datapilotflow-api"
version = "1.0.0"
description = "DataPilotFlow API - REST API exposure layer for UI and integrations"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datapilotflow-domain>=1.0.0",
    "datapilotflow-infrastructure>=1.0.0",
    "datapilotflow-services>=1.0.0",
    "datapilotflow-rag-agent>=1.0.0",
    "datapilotflow-assistant-agent>=1.0.0",
    "datapilotflow-processors>=1.0.0",  # Added for knowledge_source_preview_router
    "fastapi[standard]>=0.115.8",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.20",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "loguru>=0.7.3",
    "langgraph>=1.0.2",
    "langgraph-checkpoint-mongodb>=0.1.0",
    "PyJWT>=2.10.0",
    "opik>=1.9.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
# Define local package sources relative to this package
datapilotflow-domain = { path = "../datapilotflow-domain" }
datapilotflow-infrastructure = { path = "../datapilotflow-infrastructure" }
datapilotflow-services = { path = "../datapilotflow-services" }
datapilotflow-rag-agent = { path = "../datapilotflow-rag-agent" }
datapilotflow-assistant-agent = { path = "../datapilotflow-assistant-agent" }
datapilotflow-processors = { path = "../datapilotflow-processors" }
datapilotflow-events = { path = "../datapilotflow-events" }
