[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilotflow-infrastructure"
version = "1.0.0"
description = "Infrastructure layer for DataPilotFlow - MongoDB, Milvus, and utility clients"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "DataPilotFlow Team", email = "team@datapilotflow.com"},
]
dependencies = [
    "datapilotflow-domain>=1.0.0",
    "pymongo>=4.6.0",
    "pymilvus>=2.3.0",
    "loguru>=0.7.0",
    "opik>=0.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools]
packages = ["datapilotflow"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
datapilotflow = ["py.typed"]
