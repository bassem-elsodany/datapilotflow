[project]
name = "datapilotflow-services"
version = "1.0.0"
description = "DataPilotFlow services - Business logic orchestration layer for agents and APIs"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datapilotflow-domain>=1.0.0",
    "datapilotflow-infrastructure>=1.0.0",
    "langchain-core>=1.0.0",
    "litellm>=1.79.0",
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
    "PyJWT>=2.10.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.1,<4.1.0",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1.0",
    "fastapi>=0.115.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# Define local package sources relative to this package
datapilotflow-domain = { path = "../datapilotflow-domain" }
datapilotflow-infrastructure = { path = "../datapilotflow-infrastructure" }

[dependency-groups]
dev = ["pytest>=8.0.0"]
