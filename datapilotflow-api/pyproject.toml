[project]
name = "datapilotflow-api"
version = "1.0.0"
description = "DataPilotFlow API - REST API exposure layer for UI and integrations"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datapilotflow-domain>=1.0.0",
    "datapilotflow-persistence>=1.0.0",
    "datapilotflow-services>=1.0.0",
    "datapilotflow-agents>=1.0.0",
    "datapilotflow-mcp>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "loguru>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
