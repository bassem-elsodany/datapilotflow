[project]
name = "datapilotflow-processors"
version = "1.0.0"
description = "DataPilotFlow document processors - text splitting, document extraction, and web crawling"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datapilotflow-domain>=1.0.0",
    "datapilotflow-infrastructure>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-community>=0.3.0",
    "loguru>=0.7.3",
    "marker-pdf[full]",
    "crawl4ai>=0.6.3",
    "html2text>=2025.4.15",
    "huggingface-hub>=0.34.0,<1.0",  # Required by transformers (via marker-pdf)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]

[tool.uv.sources]
# Define local package sources relative to this package
datapilotflow-domain = { path = "../datapilotflow-domain" }
datapilotflow-infrastructure = { path = "../datapilotflow-infrastructure" }
