[project]
name = "datapilotflow-mcp"
version = "1.0.0"
description = "DataPilotFlow MCP - Model Context Protocol exposure layer for agents"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datapilotflow-agents>=1.0.0",
    "datapilotflow-domain>=1.0.0",
    "fastmcp>=0.4.0",
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
datapilotflow-mcp = "datapilotflow.mcp.cli.run_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
