[project]
name = "datapilotflow-infrastructure"
version = "1.0.0"
description = "DataPilotFlow infrastructure layer - MongoDB, message queue (RabbitMQ), vectordb (Milvus), and data access objects"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datapilotflow-domain>=1.0.0",
    "pymongo>=4.9.2",
    "pydantic>=2.10.6",
    "pymilvus>=2.6.5",
    "sentence-transformers>=5.2.0",
    "aio-pika>=9.3.0",
    "langchain-mongodb>=0.1.0",
    "loguru>=0.7.3",
    "passlib>=1.7.4",
    "bcrypt>=4.0.1,<4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# Define local package sources relative to this package
datapilotflow-domain = { path = "../datapilotflow-domain" }

[dependency-groups]
dev = ["pytest>=8.0.0"]
