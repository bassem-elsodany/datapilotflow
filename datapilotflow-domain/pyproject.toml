[project]
name = "datapilotflow-domain"
version = "1.0.0"
description = "DataPilotFlow domain models and schemas - core data types for the entire system"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0.0",
    "python-dateutil>=2.8.2",
    "loguru>=0.7.3",
    "email-validator>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]
