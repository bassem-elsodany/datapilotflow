[project]
name = "datapilotflow-persistence"
version = "1.0.0"
description = "DataPilotFlow persistence layer - MongoDB connections and data access objects"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datapilotflow-domain>=1.0.0",
    "pymongo>=4.9.2",
    "pydantic>=2.10.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]
