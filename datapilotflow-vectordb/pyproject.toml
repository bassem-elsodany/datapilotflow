[project]
name = "datapilotflow-vectordb"
version = "1.0.0"
description = "DataPilotFlow vector database layer - Milvus integration for embeddings and semantic search"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datapilotflow-domain>=1.0.0",
    "pymilvus>=2.4.0",
    "langchain-milvus>=0.2.1",
    "sentence-transformers>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]
