[project]
name = "datapilotflow-assistant-agent"
version = "1.0.0"
description = "DataPilotFlow Assistant Agent - DeepAgents-based assistant with planning and tools"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datapilotflow-domain>=1.0.0",
    "datapilotflow-services>=1.0.0",
    "deepagents>=0.1.0",
    "langgraph>=1.0.2",
    "langchain-core>=1.0.0",
    "langchain-litellm>=0.1.0",
    "langchain-mcp-adapters>=0.1.0",
    "pymongo>=4.0.0",
    "loguru>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
# Define local package sources relative to this package
datapilotflow-domain = { path = "../datapilotflow-domain" }
datapilotflow-services = { path = "../datapilotflow-services" }
