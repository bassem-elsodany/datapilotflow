[project]
name = "datapilotflow-agents"
version = "1.0.0"
description = "DataPilotFlow agents - Core RAG and Assistant agent implementations"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datapilotflow-domain>=1.0.0",
    "datapilotflow-persistence>=1.0.0",
    "datapilotflow-vectordb>=1.0.0",
    "langgraph>=1.0.2",
    "langchain-core>=1.0.0",
    "langchain-mongodb>=0.1.0",
    "langgraph-checkpoint-mongodb>=0.1.0",
    "litellm>=1.79.0",
    "opik>=1.9.11",
    "loguru>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
