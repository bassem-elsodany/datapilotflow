# DataPilotFlow — run from pre-built images, no clone or build required.
#
# Usage:
#   curl -O https://raw.githubusercontent.com/bassem-elsodany/datapilotflow/main/docker/docker-compose.ghcr.yml
#   docker compose -f docker-compose.ghcr.yml up -d
#
# `pull_policy: always` on the app services means a plain `up -d` always
# re-checks for a newer `:latest` — you don't need a separate `pull` step.
# Deploying to a remote server? Set API_BASE_URL to that server's address
# before starting: API_BASE_URL=http://your-server:8800 docker compose ...

name: datapilotflow

services:
  # ============================================================================
  # APPLICATION SERVICES (pre-built, from ghcr.io/bassem-elsodany)
  # ============================================================================

  api:
    image: ghcr.io/bassem-elsodany/datapilotflow-api:latest
    pull_policy: always
    container_name: datapilotflow-api-server
    ports:
      - "8800:8800"
    environment:
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8800
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB_NAME=datapilotflow
      - MONGO_USER=datapilotflow
      - MONGO_PASS=datapilotflow123
      - VECTOR_DB_HOST=milvus
      - VECTOR_DB_HTTP_PORT=19530
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=datapilotflow
      - RABBITMQ_PASS=datapilotflow123
    depends_on:
      mongodb:
        condition: service_healthy
      milvus:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - api-logs:/app/logs
      - api-upload:/app/upload
    networks:
      - datapilotflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  event-listeners:
    image: ghcr.io/bassem-elsodany/datapilotflow-events:latest
    pull_policy: always
    container_name: datapilotflow-event-listeners
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=datapilotflow
      - RABBITMQ_PASS=datapilotflow123
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB_NAME=datapilotflow
      - MONGO_USER=datapilotflow
      - MONGO_PASS=datapilotflow123
      - VECTOR_DB_HOST=milvus
      - VECTOR_DB_HTTP_PORT=19530
      - LOG_LEVEL=INFO
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - events-logs:/app/datapilotflow-events/logs
      - api-upload:/app/datapilotflow-events/upload
    networks:
      - datapilotflow-network
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mcp-rag-agent:
    image: ghcr.io/bassem-elsodany/datapilotflow-mcp-agent:latest
    pull_policy: always
    container_name: datapilotflow-mcp-rag
    ports:
      - "65510:65510"
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=65510
      - VECTOR_DB_HOST=milvus
      - VECTOR_DB_HTTP_PORT=19530
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB_NAME=datapilotflow
      - MONGO_USER=datapilotflow
      - MONGO_PASS=datapilotflow123
    depends_on:
      milvus:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - mcp-agent-logs:/app/logs
    networks:
      - datapilotflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:65510/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    image: ghcr.io/bassem-elsodany/datapilotflow-dashboard:latest
    pull_policy: always
    container_name: datapilotflow-dashboard
    ports:
      - "3000:3000"
    environment:
      # Read by the browser, not the container — set this to your server's
      # address if the dashboard is reached anywhere other than localhost.
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8800}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - datapilotflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================================
  # INFRASTRUCTURE SERVICES (third-party images)
  # ============================================================================

  mongodb:
    image: mongo:7.0
    container_name: datapilotflow-mongodb
    ports:
      - "27020:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=datapilotflow
      - MONGO_INITDB_ROOT_PASSWORD=datapilotflow123
      - MONGO_INITDB_DATABASE=datapilotflow
    volumes:
      - mongodb-data:/data/db
    networks:
      - datapilotflow-network
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: datapilotflow-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - datapilotflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: datapilotflow-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9002:9001"
      - "9000:9000"
    volumes:
      - milvus-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - datapilotflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.6.2
    container_name: datapilotflow-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus-data:/var/lib/milvus
    networks:
      - datapilotflow-network
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - "milvus-etcd"
      - "milvus-minio"

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: datapilotflow-rabbitmq
    ports:
      - "5675:5672"
      - "15675:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=datapilotflow
      - RABBITMQ_DEFAULT_PASS=datapilotflow123
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - datapilotflow-network
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  datapilotflow-network:
    driver: bridge

volumes:
  api-logs:
  api-upload:
  events-logs:
  mcp-agent-logs:
  mongodb-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  rabbitmq-data:
