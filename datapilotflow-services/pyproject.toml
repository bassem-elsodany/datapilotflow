[project]
name = "datapilotflow-services"
version = "1.0.0"
description = "DataPilotFlow services - Business logic orchestration layer for agents and APIs"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datapilotflow-domain>=1.0.0",
    "datapilotflow-persistence>=1.0.0",
    "datapilotflow-events>=1.0.0",
    "langchain-core>=1.0.0",
    "litellm>=1.79.0",
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
