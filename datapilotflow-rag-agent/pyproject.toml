[project]
name = "datapilotflow-rag-agent"
version = "1.0.0"
description = "DataPilotFlow RAG Agent - Retrieval-Augmented Generation agent"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datapilotflow-domain>=1.0.0",
    "datapilotflow-infrastructure>=1.0.0",
    "datapilotflow-services>=1.0.0",
    "langgraph>=1.0.2",
    "langchain-core>=1.0.0",
    "langchain-litellm>=0.1.0",
    # litellm 1.101.0 removed the `List` import that its own
    # llms/base_llm/responses/transformation.py needs at class-definition
    # time (NameError: name 'List' is not defined) — excluded until
    # upstream fixes it; 1.100.1 is the latest known-good release.
    "litellm>=1.79.0,<1.101.0",
    "loguru>=0.7.3",
    "fastmcp>=2.14.0,<4.0.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=2.14.0,<4.0.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
datapilotflow-rag-mcp = "datapilotflow.rag_agent.mcp.cli.run_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilotflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
# Define local package sources relative to this package
datapilotflow-domain = { path = "../datapilotflow-domain" }
datapilotflow-infrastructure = { path = "../datapilotflow-infrastructure" }
datapilotflow-services = { path = "../datapilotflow-services" }
